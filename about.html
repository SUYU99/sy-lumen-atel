<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我 · SY·LUMEN ATEL｜予光</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#0c0c0c;
            color:#d4b886;
            font-family:"Noto Serif SC",serif;
            padding:40px 20px;
            line-height:1.8;
        }
        .back{margin-bottom:30px;}
        .back a{color:#888;text-decoration:none;}
        .wrap{max-width:620px;margin:0 auto;}
        h1{font-size:34px;margin-bottom:6px;}
        .en{font-size:13px;color:#777;letter-spacing:2px;margin-bottom:32px;}
        p{color:#bbbbbb;margin-bottom:22px;font-size:16px;}
        .tags{
            color:#d4b886;
            letter-spacing:1px;
            margin:28px 0;
        }
        .info{margin-top:50px;color:#999;font-size:15px;}

        .slider{
            width:100%;
            height:340px;
            position:relative;
            overflow:hidden;
            margin-bottom:12px;
        }
        .slider-track{
            display:flex;
            height:100%;
            transition:transform 0.4s ease;
        }
        .slide-item{
            flex:0 0 100%;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:0 30px;
        }
        .slide-item img{
            height:100%;
            object-fit:contain;
            border-radius:14px;
        }
        .slide-tip{
            text-align:center;
            color:#888;
            font-size:14px;
            letter-spacing:1px;
            margin-bottom:36px;
        }
        .slide-btn{
            position:absolute;
            top:50%;
            transform:translateY(-50%);
            width:38px;
            height:38px;
            border-radius:50%;
            background:rgba(255,255,255,0.1);
            color:#fff;
            border:none;
            font-size:20px;
            cursor:pointer;
            z-index:2;
        }
        .prev{left:10px;}
        .next{right:10px;}
    </style>
</head>
<body>
    <div class="back"><a href="index.html">← 返回首页</a></div>
    <div class="wrap">
        <div class="slider">
            <div class="slider-track" id="track">
                <div class="slide-item">
                    <img src="images/me1.jpg" alt="个人照片">
                </div>
                <div class="slide-item">
                    <img src="images/me2.jpg" alt="个人照片">
                </div>
                <div class="slide-item">
                    <img src="images/me3.jpg" alt="个人照片">
                </div>
                <div class="slide-item">
                    <img src="images/me4.jpg" alt="个人照片">
                </div>
                <div class="slide-item">
                    <img src="images/me5.jpg" alt="个人照片">
                </div>
            </div>
            <button class="slide-btn prev" onclick="slidePrev()"><</button>
            <button class="slide-btn next" onclick="slideNext()">></button>
        </div>
        <div class="slide-tip">左右滑动查看 · SWIPE</div>

        <h1>关于我 📸</h1>
        <div class="en">ABOUT ME</div>
        <p>人生不止一瞬，美自恒存，亦是我心之所向。这便是工作室的初心，也是我的目光，所要触及的风景。</p>
        <p>主营摄影与动态影像：婚纱、活动、肖像、宣传片、旅拍，一站式交付静帧照片与动态影片。</p>
        <p class="tags">柔光 cinematic｜清透奶油｜情绪纪实</p>
        <p>于光影之中寻找审美同频的伙伴，共勉，共创。</p>
        <div class="info">
            <p>工坊 / ATELIER：SY·LUMEN ATEL｜予光<br>主理人 / OWNER：SuYU<br>媒介 / MEDIUM：摄影 & 摄像<br>从业年限：3 年</p>
        </div>
    </div>

<script>
    const track = document.getElementById('track');
    let index = 0;
    const total = 5;

    function updateSlide(){
        track.style.transform = `translateX(-${index * 100}%)`;
    }

    function slidePrev(){
        index = index <= 0 ? total - 1 : index - 1;
        updateSlide();
    }

    function slideNext(){
        index = index >= total - 1 ? 0 : index + 1;
        updateSlide();
    }

    let startX = 0;

    track.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
    });

    track.addEventListener('touchend', e => {
        const endX = e.changedTouches[0].clientX;
        const diff = endX - startX;

        if (diff < -40) slideNext();
        if (diff > 40) slidePrev();
    });
</script>
</body>
</html>
