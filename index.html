<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SY·LUMEN ATEL｜予光</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            height:100%;
            font-family:"PingFang SC","Microsoft Yahei",sans-serif;
        }
        .wrap{
            width:100%;
            height:100%;
            /* 默认：电脑横图 */
            background: url("./images/bg-pc.jpg") center center / cover no-repeat;
            position:relative;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:#fff;
        }
        /* 小于768px自动切为手机竖图 */
        @media (max-width:768px){
            .wrap{
                background: url("./images/bg-m.jpg") center center / cover no-repeat;
            }
        }
        .mask{
            position:absolute;
            inset:0;
            background:rgba(0,0,0,0.42);
        }
        .content{
            z-index:2;
            text-align:center;
            padding:20px;
        }
        h1{
            font-size:36px;
            font-weight:400;
            letter-spacing:6px;
            margin-bottom:12px;
        }
        .slogan{
            font-size:15px;
            opacity:0.75;
            margin-bottom:60px;
            letter-spacing:2px;
        }
        .btn-group{
            display:flex;
            flex-direction:column;
            gap:22px;
        }
        a.btn{
            display:block;
            width:220px;
            line-height:52px;
            border:1px solid rgba(255,255,255,0.65);
            color:#fff;
            text-decoration:none;
            border-radius:999px;
            font-size:15px;
            letter-spacing:2px;
            transition:0.3s;
            margin:0 auto;
        }
        a.btn:hover{
            background:rgba(255,255,255,0.18);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="mask"></div>
        <div class="content">
            <h1>SY·LUMEN ATEL</h1>
            <div class="slogan">予光工坊 · LIGHT & FRAME</div>
            <div class="btn-group">
                <a class="btn" href=" works.html">作品集 PORTFOLIO</a >
                <a class="btn" href="booking.html">预约拍摄 BOOKING</a >
                <a class="btn" href="about.html">关于 ABOUT</a >
            </div>
        </div>
    </div>
</body>
</html>
